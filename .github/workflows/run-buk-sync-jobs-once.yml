name: Run BUK Sync Jobs Once

on:
  workflow_dispatch:
    inputs:
      job_ids_json:
        description: "JSON array of buk_sync_jobs UUIDs to process"
        required: true
        type: string
      inspect_employee_id:
        description: "Optional BUK employee id to inspect plans"
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate inputs and required secret
        env:
          JOB_IDS_JSON: ${{ inputs.job_ids_json }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          echo "$JOB_IDS_JSON" | jq -e 'type == "array" and length > 0 and length <= 10 and all(.[]; type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"; "i"))' >/dev/null

      - name: Invoke production BUK sync edge function
        env:
          JOB_IDS_JSON: ${{ inputs.job_ids_json }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_FUNCTION_URL: https://pzblmbahnoyntrhistea.supabase.co/functions/v1/sync-buk-candidates
        run: |
          payload="$(jq -cn --argjson jobIds "$JOB_IDS_JSON" '{jobIds: $jobIds, limit: 10}')"
          curl --fail-with-body --show-error --silent --request POST \
            --header "Content-Type: application/json" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data "$payload" "$SUPABASE_FUNCTION_URL"

      - name: Inspect BUK plan catalog for a known employee
        if: ${{ inputs.inspect_employee_id != '' }}
        env:
          INSPECT_EMPLOYEE_ID: ${{ inputs.inspect_employee_id }}
          BUK_EMPLOYEES_URL: https://busesjm.buk.cl/api/v1/chile/employees
          BUK_AUTH_TOKEN: ${{ secrets.BUK_AUTH_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --header "Accept: application/json" \
            --header "auth_token: ${BUK_AUTH_TOKEN}" \
            "${BUK_EMPLOYEES_URL%/}/${INSPECT_EMPLOYEE_ID}/plans"
