name: Process BUK Candidate Document Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    concurrency:
      group: process-buk-candidate-document-queue
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate required variables
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUK_DOCUMENT_QUEUE_WEBHOOK_SECRET: ${{ secrets.BUK_DOCUMENT_QUEUE_WEBHOOK_SECRET }}
        run: |
          test -n "${VITE_SUPABASE_URL:-${SUPABASE_URL:-$NEXT_PUBLIC_SUPABASE_URL}}" || { echo "Missing Supabase URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$BUK_DOCUMENT_QUEUE_WEBHOOK_SECRET" || { echo "Missing BUK_DOCUMENT_QUEUE_WEBHOOK_SECRET"; exit 1; }

      - name: Process bounded BUK document queue
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUK_DOCUMENT_QUEUE_WEBHOOK_SECRET: ${{ secrets.BUK_DOCUMENT_QUEUE_WEBHOOK_SECRET }}
        run: node scripts/process-buk-candidate-document-queue.mjs
